name: verificacion estatica

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same Node as .nvmrc. Installs the pnpm version from
      # package.json#packageManager and refuses an install the lockfile does not describe.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24.22.0
          cache: true
          require-lockfile: true

      - name: eslint y stylelint
        run: pnpm run lint

      - name: tipos
        run: pnpm run typecheck

      - name: markdownlint
        run: pnpm run lint:md
